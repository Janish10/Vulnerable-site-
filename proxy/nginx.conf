    # Certificate Targets — certs.krizznaa.tech
    server {
        listen 443 ssl;
        server_name certs.krizznaa.tech;

        ssl_certificate     /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            proxy_pass http://cert_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Expired cert testing endpoint
        location /expired {
            proxy_pass https://certificate-targets:3015;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
        }

        # Wrong-hostname cert testing endpoint
        location /wrong-host {
            proxy_pass https://certificate-targets:3016;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
        }
    }

    # ── HTTP: redirect most subdomains to HTTPS ─────────────────────

    # Bare domain landing — HTTP
    server {
        listen 80;
        server_name krizznaa.tech;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Generic HTTPS redirect for all app/api subdomains
    server {
        listen 80;
        server_name app.krizznaa.tech api.krizznaa.tech;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # FP-30/FP-31: HTTP behavior for certificate-targets
    # benign.krizznaa.tech on HTTP returns 403 (FP-31: 403 is NOT "content served")
    server {
        listen 80;
        server_name benign.krizznaa.tech;

        # Most paths redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # FP-31 trap: /http-403 returns 403 on plain HTTP
        location /http-403 {
            return 403 '{"error":"forbidden"}';
            add_header Content-Type application/json;
        }

        # FP-30 trap: /http-content returns actual content on HTTP
        location /http-content {
            proxy_pass http://benign_mock;
            proxy_set_header Host $host;
        }
    }

    # Real services on HTTP (some intentionally serve content for FP-30 testing)
    server {
        listen 80;
        server_name grafana.krizznaa.tech
                    jenkins.krizznaa.tech
                    fake-grafana.krizznaa.tech
                    fake-jenkins.krizznaa.tech
                    kibana.krizznaa.tech
                    prometheus.krizznaa.tech
                    wordpress.krizznaa.tech
                    storage.krizznaa.tech
                    nextcloud.krizznaa.tech
                    angular.krizznaa.tech
                    admin.krizznaa.tech
                    api-target.krizznaa.tech
                    nginx-old.krizznaa.tech
                    nginx-current.krizznaa.tech
                    certs.krizznaa.tech;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Catch-all for unknown subdomains
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        return 404 '{"error":"not_found","message":"Unknown subdomain"}';
        add_header Content-Type application/json;
    }
