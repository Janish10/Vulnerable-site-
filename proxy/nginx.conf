worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Upstream definitions
    upstream frontend  { server frontend:5173; }
    upstream backend   { server backend:3000; }
    upstream grafana_real   { server grafana:3000; }
    upstream jenkins_real   { server jenkins:8080; }
    upstream grafana_mock   { server grafana-like:3001; }
    upstream jenkins_mock   { server jenkins-like:3002; }
    upstream kibana_mock    { server kibana-like:3003; }
    upstream prometheus_mock { server prometheus-like:3004; }
    upstream wordpress_mock { server wordpress-like:3005; }
    upstream storage_mock   { server storage-like:3006; }
    upstream nextcloud_mock { server nextcloud-like:3007; }
    upstream angular_mock   { server angular-app:3008; }
    upstream benign_mock    { server intentionally-benign:3009; }
    upstream admin_mock     { server admin-console:3010; }
    upstream api_target_mock { server api-target:3011; }
    upstream nginx_old      { server nginx-targets:3012; }
    upstream nginx_current  { server nginx-targets:3013; }
    upstream cert_target    { server certificate-targets:3014; }

    # Shared proxy params
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTPS: wildcard *.krizznaa.tech ──────────────────────────────

    # Landing page — krizznaa.tech (bare domain)
    server {
        listen 443 ssl;
        server_name krizznaa.tech;

        ssl_certificate     /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            root /usr/share/nginx/html/landing;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Frontend — app.krizznaa.tech
    server {
        listen 443 ssl;
        server_name app.krizznaa.tech;

        ssl_certificate     /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API — api.krizznaa.tech
    server {
        listen 443 ssl;
        server_name api.krizznaa.tech;

        ssl_certificate     /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

